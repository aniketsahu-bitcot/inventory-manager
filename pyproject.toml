[project]
name = "inventory_manager"                    
version = "0.1.0"                             
description = "Simple inventory management with Product/Inventory classes"  
authors = [{ name = "Aniket Sahu" }]         
readme = "README.md"                         
requires-python = ">=3.10"                    

dependencies = [
    "pydantic>=2.0.0",     
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "SQLAlchemy>=2.0.20",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",                            
    "black>=24.0.0",                               
]

[tool.pytest.ini_options]
pythonpath = [
  "."
]

[tool.ruff]
line-length = 88

[tool.black]
line-length = 88                   